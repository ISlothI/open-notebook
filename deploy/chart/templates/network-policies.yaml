{{- $root := . }}
{{- $ingress := dict "namespaceSelector" (dict "matchLabels" (dict "kubernetes.io/metadata.name" "kube-system")) }}
{{- $monitoring := dict "namespaceSelector" (dict "matchLabels" (dict "kubernetes.io/metadata.name" "monitoring")) }}
{{- /* Nothing is allowed unless a policy below allows it. */}}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ .Release.Name }}-default-deny
spec:
  podSelector: {}
  policyTypes: [Ingress, Egress]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ .Release.Name }}-dns
spec:
  podSelector: {}
  policyTypes: [Egress]
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - { port: 53, protocol: UDP }
        - { port: 53, protocol: TCP }
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ .Release.Name }}-api
spec:
  podSelector:
    matchLabels: {{- include "open-notebook.selector" (dict "root" $root "component" "api") | nindent 6 }}
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        - {{- toYaml $ingress | nindent 10 }}
        - {{- toYaml $monitoring | nindent 10 }}
      ports:
        - { port: 8000 }
  egress:
    - to:
        - podSelector:
            matchLabels: {{- include "open-notebook.selector" (dict "root" $root "component" "database") | nindent 14 }}
      ports:
        - { port: 5432 }
    - to:
        - podSelector:
            matchLabels: {{- include "open-notebook.selector" (dict "root" $root "component" "embedder") | nindent 14 }}
      ports:
        - { port: 8001 }
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ .Release.Name }}-worker
spec:
  podSelector:
    matchLabels: {{- include "open-notebook.selector" (dict "root" $root "component" "worker") | nindent 6 }}
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        - {{- toYaml $monitoring | nindent 10 }}
      ports:
        - { port: 9100 }
  egress:
    - to:
        - podSelector:
            matchLabels: {{- include "open-notebook.selector" (dict "root" $root "component" "database") | nindent 14 }}
      ports:
        - { port: 5432 }
    - to:
        - podSelector:
            matchLabels: {{- include "open-notebook.selector" (dict "root" $root "component" "embedder") | nindent 14 }}
      ports:
        - { port: 8001 }
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ .Release.Name }}-embedder
spec:
  podSelector:
    matchLabels: {{- include "open-notebook.selector" (dict "root" $root "component" "embedder") | nindent 6 }}
  policyTypes: [Ingress]
  ingress:
    - from:
        {{- range $component := list "api" "worker" }}
        - podSelector:
            matchLabels: {{- include "open-notebook.selector" (dict "root" $root "component" $component) | nindent 14 }}
        {{- end }}
        - {{- toYaml $monitoring | nindent 10 }}
      ports:
        - { port: 8001 }
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ .Release.Name }}-database
spec:
  podSelector:
    matchLabels: {{- include "open-notebook.selector" (dict "root" $root "component" "database") | nindent 6 }}
  policyTypes: [Ingress]
  ingress:
    - from:
        {{- range $component := list "api" "worker" }}
        - podSelector:
            matchLabels: {{- include "open-notebook.selector" (dict "root" $root "component" $component) | nindent 14 }}
        {{- end }}
      ports:
        - { port: 5432 }
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ .Release.Name }}-web
spec:
  podSelector:
    matchLabels: {{- include "open-notebook.selector" (dict "root" $root "component" "web") | nindent 6 }}
  policyTypes: [Ingress]
  ingress:
    - from:
        - {{- toYaml $ingress | nindent 10 }}
      ports:
        - { port: 8080 }
