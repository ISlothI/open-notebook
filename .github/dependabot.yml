version: 2

updates:
  - package-ecosystem: uv
    directory: /backend
    schedule: { interval: monthly }
    groups:
      python: { patterns: ["*"] }
    commit-message: { prefix: "build" }

  - package-ecosystem: npm
    directory: /web
    schedule: { interval: monthly }
    groups:
      npm: { patterns: ["*"] }
    commit-message: { prefix: "build" }

  - package-ecosystem: docker
    directories: [/backend, /web, /database, /tools/toolbox]
    schedule: { interval: monthly }
    groups:
      images: { patterns: ["*"] }
    commit-message: { prefix: "build" }

  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: monthly }
    groups:
      actions: { patterns: ["*"] }
    commit-message: { prefix: "ci" }
